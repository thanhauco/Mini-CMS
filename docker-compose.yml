version: '3.4'

services:
  minicms.api:
    image: ${DOCKER_REGISTRY-}minicmsapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=minicms;Username=postgres;Password=postgres
      - Storage__Path=/app/uploads
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:11-alpine
    environment:
      - POSTGRES_DB=minicms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
